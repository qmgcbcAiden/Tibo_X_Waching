services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: tibo-x-watcher:local
    init: true
    ipc: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    expose:
      - "8787"
    networks:
      edge-public:
        aliases:
          - tibo-watch-watcher
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge-public:
    external: true
